# Protocol v16: extension of the confidence-only planting results. Part A trains a second
# architecture (ST-GCN), part B adds seeds to the CompactCTRGCN no-remedy cell, part C tests Group
# DRO with groups computed from the input instead of the planted severity. Frozen and committed
# before any fit under it is trained or scored; the commit hash is recorded in
# configs/protocols/REGISTRY.md by the following commit. Definitions (host, operators, worlds,
# severities, R, MWI, mask-mean statistics, length protocol, selection repair) are those of v7, v8,
# v12, v13, repair_selection_v14 and v15conf unless restated here.

frozen: true
frozen_date: 2026-11-10
status: within-project prespecification; added after the main analyses, frozen before its fits
purpose: >
  Test three limits of the confidence-only result: (A) whether the planted-cue dependence and the
  failure of standard checks to show it reproduce in a second architecture that reads confidence;
  (B) the seed-level uncertainty of the no-remedy interaction with nine seeds per world; (C)
  whether Group DRO lowers the interaction when its groups come from a statistic measured on the
  input rather than from the planted severity. Every outcome is reported.
depends_on: [armconf_v13.yaml, repair_selection_v14.yaml, remedies_confonly_v15.yaml, train_recipe_v15.md]
inherits: remedies_confonly_v15.yaml

# ------------------------------------------------------------------ common setting
mechanism: armruns              # operator confscale (safe_motion/planted.py MECHANISM_MODE)
strength: mid
worlds: [S, I]
world_seed: 0                   # the training masks of v15conf (w0)
valid_rule: coords              # the coordinate-invariant rule of protocol v13
training_recipe: v15            # configs/protocols/train_recipe_v15.md; the trainer refuses v16 otherwise
model_and_training: >
  as v15conf (25 epochs, batch 128, AMP, image normalisation, cosine schedule, AdamW 1e-3 / 1e-4,
  c_in 3: x, y, confidence; no dropout), with the architecture of each part below
selection:
  machinery: per-epoch path of repair_selection_v14 (every epoch state and validation predictions stored)
  metric: validation AUROC, first epoch reaching the maximum
  cleaned: validation rows without val_exclude_ids; PRIMARY
  original: all validation rows; stored and scored as a sensitivity set
val_exclude_ids: [322]
val_exclude_rule: validation rows of any person already used for optimization (repair_selection_v14)
outputs:
  epoch_dir: results/v16/epochs
  cache_root: cache/v16
note: protocol v16, confidence-only extension (ST-GCN, more seeds, observed-group Group DRO)

# ------------------------------------------------------------------ parts and cells
parts:
  A_stgcn:
    cell: A_none_stgcn
    architecture: ST-GCN (Yan et al. 2018; safe_motion/models/baselines.py STGCN, 10 blocks,
      64/128/256 channels, about 3.07M parameters, copied unchanged from SAFE-SMM)
    seeds: [0, 1, 2]
    runs: "2 worlds x 3 seeds = 6"
  B_seeds:
    cell: A_none (CompactCTRGCN)
    seeds: [3, 4, 5, 6, 7, 8]
    runs: "2 worlds x 6 seeds = 12"
    pooled_with: >
      the v15conf A_none fits, seeds 0-2 (same recipe, rule, training masks and selection), giving
      nine seeds per world. The pooling is planned here, before the new fits.
  C_obsgroups:
    cell: C_groupdro_obs (CompactCTRGCN)
    method: >
      Group DRO exactly as v15conf C_groupdro (four groups, exponentiated-gradient weights, step
      0.01), except the group is 2 x label + (measured arm low-confidence fraction of the planted
      segment above the median over the optimization rows). The statistic is the fourth SAFE-SMM
      quality feature (safe_motion/remedies.py quality_stats), computed on the full planted segment
      the model is trained on; the planted severity is never read (safe_motion/remedies.py
      observed_groups). The share of training and validation rows whose group equals the
      severity group is logged per fit.
    seeds: [0, 1, 2]
    runs: "2 worlds x 3 seeds = 6"
runs_total: 24

# ------------------------------------------------------------------ gates
gates:
  G16_invariance: >
    All cells use the SegmentDataset path with the "coords" rule unchanged, so the v13 invariance
    gate applies; score_v16.py refuses a checkpoint that does not carry valid_rule "coords".
  G16_A_convergence: >
    Part A is interpreted only if the mean clean-test AUROC of the World I ST-GCN models (cleaned
    selection, three seeds) is at least 0.75. Otherwise part A is reported as not converged under
    the shared training budget and no interaction is read.

# ------------------------------------------------------------------ scoring
scoring: >
  As v15conf: clean; own operator at mid, worlds S and I, test mask seeds 2000, 3000, 4000; the four
  operators at mid, mask 2000. Host test rows as v7. Statistics on the mask mean inside each of
  2,000 paired identifier-clustered resamples, seeds averaged inside resamples (analyze_v7_masks.py
  convention). Confidence-channel replacement as score_conf_reliance.py (clean, five
  permutations, constant; planted S and I, first mask, as planted and permuted), for all v16 models.

# ------------------------------------------------------------------ pre-specified rules
criteria:
  P16_A1_reproduction:
    contrast: MWI of the ST-GCN no-remedy cell, logit and raw AUROC, cleaned selection
    pass_if: >
      the conditional paired interval lies entirely above zero on both scales. Only then may the
      text say that the planted confidence-cue dependence reproduces in ST-GCN.
    report: >
      R(f_S) and R(f_I) with intervals (reference read against the +-0.05 margin); clean AUROC of
      f_S minus f_I with interval (read against +-0.02); the seed-and-mask sensitivity interval;
      permutation reliance on clean and on planted input for both worlds.
  D16_A2_architecture:
    descriptive: true
    report: MWI(ST-GCN) minus MWI(CompactCTRGCN, v15conf A_none seeds 0-2), paired interval; no rule
  P16_B1_precision:
    descriptive: true
    report: >
      MWI of the CompactCTRGCN no-remedy cell with nine seeds per world: conditional interval;
      seed-level 95% interval from the per-seed mask-mean responses (Welch t interval for the
      difference of the two worlds' mean responses); per-world seed SD; and the seed-and-mask
      sensitivity interval. No pass rule.
  P16_C1_reduction:
    contrast: MWI(C_groupdro_obs) - MWI(A_none, seeds 0-2 of v15conf), cleaned selection
    pass_if: >
      the paired interval lies entirely below zero on the logit and on the raw scale (the P15_1
      rule). Only then may the text say that Group DRO with input-derived groups lowers the
      interaction. One contrast; no family. Sensitivity: the same contrast against all nine A_none
      seeds per world.
    report: >
      clean-AUROC change in each world with intervals; group agreement with the severity groups;
      MWI(C_groupdro_obs) minus MWI(C_groupdro, v15conf), paired, descriptive.
reporting_rules: >
  Cleaned selection is primary; the original selection goes to the supplement. No fit is rerun to
  move an interval. In the planted worlds the measured arm low-confidence fraction tracks the
  planted severity closely, so part C shows Group DRO without access to the planting variable, not
  a remedy for natural tracking failures; the text must say so. The outcome of every part is
  reported, including a failed gate or a non-detection. The results enter the manuscript only after
  the authors decide how.

# ------------------------------------------------------------------ compute
compute: >
  Two on-demand g5.2xlarge instances in parallel (us-east-1c, other zones of the VPC on capacity
  errors), one for part A (queue v16a) and one for parts B and C (queue v16bc), each scoring its own
  checkpoints and terminating itself. Runtime guard SM_MAX_HOURS=6 per instance. Projected cost
  about USD 8; author cap USD 20.
